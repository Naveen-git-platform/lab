name: Validate WorkPulse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check app files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check HTML structure and required app elements
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")
          css = Path("styles.css").read_text(encoding="utf-8")
          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.scripts = []
                  self.styles = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if "id" in values:
                      self.ids.append(values["id"])
                  if tag == "script" and values.get("src"):
                      self.scripts.append(values["src"])
                  if tag == "link" and values.get("rel") == "stylesheet":
                      self.styles.append(values.get("href"))
          checker = Checker()
          checker.feed(html)
          assert len(checker.ids) == len(set(checker.ids)), "Duplicate HTML id found"
          for required in ("app-content", "entry-modal", "entry-form", "global-search", "backup-modal", "welcome-screen", "welcome-form", "explore-demo"):
              assert required in checker.ids, f"Missing required element id: {required}"
          assert "./app.js" in checker.scripts, "app.js is not linked"
          assert "./styles.css" in checker.styles, "styles.css is not linked"
          for required in ("renderOverview", "renderTimesheet", "exportCSV", "restoreBackup", "localStorage", "workpulse.profile.v1", "entries.filter(entry=>!entry.demo)"):
              assert required in app, f"Missing expected app feature: {required}"
          assert "@media" in css, "Responsive styles are missing"
          assert "prefers-reduced-motion:reduce" in css, "Reduced-motion support is missing"
          assert ":focus-visible" in css, "Visible keyboard focus styles are missing"
          print(f"HTML smoke checks passed: {len(checker.ids)} unique ids")
          print("Application files and expected features are present")
          PY
